<mat-tab-group animationDuration="0ms">
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon [fontSet]="iconSet" [fontIcon]="icons.BOOK"></mat-icon>
      <span>{{ "LBL_ABOUT_ME" | transloco }}</span>
    </ng-template>
    <ng-template matTabContent>
      <app-about-me/>
    </ng-template>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon [fontSet]="iconSet" [fontIcon]="icons.LIGHTBULB"></mat-icon>
      <span>{{ "LBL_PROJECTS" | transloco }}</span>
    </ng-template>
    <ng-template matTabContent>
      <app-projects/>
    </ng-template>
  </mat-tab>

  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon [fontSet]="iconSet" [fontIcon]="icons.LIST"></mat-icon>
      <span>{{ "LBL_SKILLS" | transloco }}</span>
    </ng-template>
    <ng-template matTabContent>
      <app-skills/>
    </ng-template>
  </mat-tab>
</mat-tab-group>
